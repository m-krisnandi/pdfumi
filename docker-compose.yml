services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdfumi
      POSTGRES_USER: pdfumi
      POSTGRES_PASSWORD: pdfumi
    ports:
      - "5432:5432"
    volumes:
      - pdfumi_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pdfumi_pg: